services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroart-kzn-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/neuroart.db
